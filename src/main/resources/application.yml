spring:
  application:
    name: fraud-rule-engine
  config:
    import: classpath:fraud-rules.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraud}
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:}
    hikari:
      # Requests waiting on an account lock hold a connection, so the pool is sized explicitly and a request that
      # can't get one fails fast (503 + Retry-After) instead of queuing behind a burst on one account.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 2000 # milliseconds: Hikari binds this as a plain long, so "2s" fails startup
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/fraud-engine}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
  endpoint:
    health:
      probes:
        enabled: true

fraud:
  flag-threshold: 50
  account-lock-timeout: 1s
  # Currency that rule thresholds are written in. Other currencies are accepted while they have a row in exchange_rate.
  base-currency: ZAR
  # The rules are in fraud-rules.yml, imported below into this same fraud namespace.
  timestamp:
    max-age: PT24H
    max-future-skew: PT5M

springdoc:
  show-actuator: false
openapi:
  token-url: ${OPENAPI_TOKEN_URL:http://localhost:8180/realms/fraud-engine/protocol/openid-connect/token}

logging:
  structured:
    format:
      console: ecs
