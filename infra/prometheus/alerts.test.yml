# Run: docker run --rm -v "$PWD/infra/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.15.0 test rules /p/alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: service down fires after 1 minute
    interval: 1m
    input_series:
      - series: 'up{job="fraud-rule-engine",instance="app:8080"}'
        values: "1 1 0 0 0"
      - series: 'up{job="fraud-api-gateway",instance="gateway:8090"}'
        values: "1 1 1 1 1"
    alert_rule_test:
      - eval_time: 2m
        alertname: FraudServiceDown
        exp_alerts: []
      - eval_time: 4m
        alertname: FraudServiceDown
        exp_alerts:
          - exp_labels: { severity: critical, job: fraud-rule-engine, instance: "app:8080" }
            exp_annotations:
              summary: "fraud-rule-engine is down"
              description: "Prometheus can't scrape fraud-rule-engine (app:8080). Check the container and its logs."

  - name: gateway error rate
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="fraud-api-gateway",uri="UNKNOWN",status="201"}'
        values: "0+60x20"
      - series: 'http_server_requests_seconds_count{application="fraud-api-gateway",uri="UNKNOWN",status="503"}'
        values: "0+30x20"
      - series: 'http_server_requests_seconds_count{application="fraud-api-gateway",uri="/actuator/prometheus",status="200"}'
        values: "0+600x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: GatewayHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Gateway 5xx rate is 33.33%"
              description: "More than 5% of gateway responses are server errors. Usually the fraud service is down, slow (timeouts) or failing."

  - name: gateway error rate ignores near-zero traffic
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="fraud-api-gateway",uri="UNKNOWN",status="503"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: GatewayHighErrorRate
        exp_alerts: []

  - name: gateway latency
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{application="fraud-api-gateway",uri="UNKNOWN",status="200",le="1.0"}'
        values: "0x30"
      - series: 'http_server_requests_seconds_bucket{application="fraud-api-gateway",uri="UNKNOWN",status="200",le="2.5"}'
        values: "0+60x30"
      - series: 'http_server_requests_seconds_bucket{application="fraud-api-gateway",uri="UNKNOWN",status="200",le="+Inf"}'
        values: "0+60x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: GatewayHighLatency
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Gateway p95 latency is 2.425s"
              description: "Successful requests are slow. Check the service latency and database connection pool panels."

  - name: account busy spike
    interval: 1m
    input_series:
      - series: 'fraud_submissions_total{application="fraud-rule-engine",outcome="account_busy"}'
        values: "0 0 0+5x10"
    alert_rule_test:
      - eval_time: 9m
        alertname: AccountBusySpike
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "25 submissions rejected as account busy in 5 minutes"
              description: "Many concurrent submissions for the same account(s) are timing out on the account lock. Possible burst attack, or the database is slow. The service logs name the (masked) accounts."

  - name: account busy stays quiet for a few rejections
    interval: 1m
    input_series:
      - series: 'fraud_submissions_total{application="fraud-rule-engine",outcome="account_busy"}'
        values: "0 1 2 3 3 3 3 3 3 3"
    alert_rule_test:
      - eval_time: 9m
        alertname: AccountBusySpike
        exp_alerts: []

  - name: unusual flag rate
    interval: 1m
    input_series:
      - series: 'fraud_assessments_total{application="fraud-rule-engine",flagged="true"}'
        values: "0+40x40"
      - series: 'fraud_assessments_total{application="fraud-rule-engine",flagged="false"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 32m
        alertname: FlagRateUnusual
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "40% of new assessments are flagged"
              description: "The flag rate is unusually high. Either a fraud wave, or a rule threshold was misconfigured. Check the rule hits panel."

  - name: flag rate needs enough volume
    interval: 1m
    input_series:
      - series: 'fraud_assessments_total{application="fraud-rule-engine",flagged="true"}'
        values: "0x40 1"
      - series: 'fraud_assessments_total{application="fraud-rule-engine",flagged="false"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 32m
        alertname: FlagRateUnusual
        exp_alerts: []

  - name: auth rejections
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="fraud-api-gateway",uri="UNKNOWN",status="401"}'
        values: "0+120x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: EdgeAuthRejectionsHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Gateway rejects 2 requests/s for missing or wrong credentials"
              description: "Sustained 401/403 responses: a client with an expired or misconfigured token, or someone probing the API."

  - name: database connections waiting
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_pending{application="fraud-rule-engine",pool="HikariPool-1"}'
        values: "0 0 1 2 1 3 1 1 1 1"
    alert_rule_test:
      - eval_time: 9m
        alertname: DatabaseConnectionsWaiting
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Requests are waiting for database connections"
              description: "The connection pool has been exhausted repeatedly for 5 minutes. Look for a burst on one account (AccountBusySpike) or slow queries."

  - name: heap high counts only pools with a max
    interval: 1m
    input_series:
      - series: 'jvm_memory_used_bytes{application="fraud-rule-engine",area="heap",id="G1 Old Gen"}'
        values: "950x15"
      - series: 'jvm_memory_max_bytes{application="fraud-rule-engine",area="heap",id="G1 Old Gen"}'
        values: "1000x15"
      - series: 'jvm_memory_used_bytes{application="fraud-rule-engine",area="heap",id="G1 Eden Space"}'
        values: "400x15"
      - series: 'jvm_memory_max_bytes{application="fraud-rule-engine",area="heap",id="G1 Eden Space"}'
        values: "-1x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: JvmHeapHigh
        exp_alerts:
          - exp_labels: { severity: warning, application: fraud-rule-engine }
            exp_annotations:
              summary: "fraud-rule-engine heap is 95% full"
              description: "Old-generation heap has stayed above 90% for 10 minutes. Risk of long GC pauses or OutOfMemoryError."
