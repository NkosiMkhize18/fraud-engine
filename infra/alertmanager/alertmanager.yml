route:
  receiver: default
  group_by: [alertname, job, application]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default

inhibit_rules:
  - source_matchers: [alertname="FraudServiceDown"]
    target_matchers: [severity="warning"]
