
x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    user: "70:70"
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set it in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fraud-pgdata:/var/lib/postgresql/data
    networks: [data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 10

  bootstrap:
    <<: *hardening
    restart: "no"
    image: alpine:3.20
    read_only: true
    tmpfs: [/tmp]
    environment:
      TRANSACTION_SUBMITTER_SECRET: ${TRANSACTION_SUBMITTER_SECRET:?set it in .env (see .env.example)}
      ASSESSMENT_READER_SECRET: ${ASSESSMENT_READER_SECRET:?set it in .env (see .env.example)}
      METRICS_SCRAPER_SECRET: ${METRICS_SCRAPER_SECRET:?set it in .env (see .env.example)}
      DOCS_CLIENT_SECRET: ${DOCS_CLIENT_SECRET:?set it in .env (see .env.example)}
      DOCS_VIEWER_PASSWORD: ${DOCS_VIEWER_PASSWORD:?set it in .env (see .env.example)}
    command:
      - sh
      - -c
      - |
        sed \
          -e "s|__TRANSACTION_SUBMITTER_SECRET__|$$TRANSACTION_SUBMITTER_SECRET|g" \
          -e "s|__ASSESSMENT_READER_SECRET__|$$ASSESSMENT_READER_SECRET|g" \
          -e "s|__METRICS_SCRAPER_SECRET__|$$METRICS_SCRAPER_SECRET|g" \
          -e "s|__DOCS_CLIENT_SECRET__|$$DOCS_CLIENT_SECRET|g" \
          -e "s|__DOCS_VIEWER_PASSWORD__|$$DOCS_VIEWER_PASSWORD|g" \
          /template/fraud-engine-realm.json > /import/fraud-engine-realm.json
        printf '%s' "$$METRICS_SCRAPER_SECRET" > /secrets/metrics-scraper.secret
    volumes:
      - ./infra/keycloak/fraud-engine-realm.json:/template/fraud-engine-realm.json:ro
      - keycloak-import:/import
      - prometheus-secrets:/secrets
    networks: [backend]

  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set it in .env (see .env.example)}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak-import:/opt/keycloak/data/import:ro
    networks: [edge, backend]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *hardening
    image: redis:8-alpine
    user: "999:999"
    read_only: true
    tmpfs: [/data]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    networks: [cache]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    <<: *hardening
    profiles: [app]
    build: .
    read_only: true
    tmpfs: [/tmp]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fraud
      DB_USER: fraud
      DB_PASSWORD: ${DB_PASSWORD:?set it in .env (see .env.example)}
      JWT_ISSUER_URI: http://localhost:8180/realms/fraud-engine
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/fraud-engine/protocol/openid-connect/certs
    networks: [backend, data]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  gateway:
    <<: *hardening
    profiles: [app]
    build: ./gateway
    read_only: true
    tmpfs: [/tmp]
    environment:
      FRAUD_ENGINE_URI: http://app:8080
      REDIS_HOST: redis
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      JWT_ISSUER_URI: http://localhost:8180/realms/fraud-engine
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/fraud-engine/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      DOCS_CLIENT_SECRET: ${DOCS_CLIENT_SECRET:?set it in .env (see .env.example)}
    ports:
      - "8090:8090"
    networks: [edge, backend, cache]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      app:
        condition: service_healthy

  prometheus:
    <<: *hardening
    profiles: [app]
    image: prom/prometheus:v3.15.1
    user: "65534:65534"
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-secrets:/prometheus/secrets:ro
      - fraud-prometheus:/prometheus
    networks: [backend, monitoring]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      alertmanager:
        condition: service_healthy

  alertmanager:
    <<: *hardening
    profiles: [app]
    image: prom/alertmanager:v0.34.1
    user: "65534:65534"
    read_only: true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
      - fraud-alertmanager:/alertmanager
    networks: [monitoring]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    <<: *hardening
    profiles: [app]
    image: grafana/grafana:13.2.2
    read_only: true
    tmpfs: [/tmp]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/fraud-engine.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - fraud-grafana:/var/lib/grafana
    networks: [monitoring]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  edge: {}
  backend: {}
  data: {}
  cache: {}
  monitoring: {}

volumes:
  fraud-pgdata:
  keycloak-import:
  prometheus-secrets:
  fraud-prometheus:
  fraud-grafana:
  fraud-alertmanager:
